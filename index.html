<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaushal Deekshant Samaroh 2026 — NSTI Calicut Coordination Portal</title>
<style>
:root{--fs:16px}
[data-theme=light]{--bg1:#eaf4ff;--bg2:#fff6e6;--bg3:#e9fbf3;--card:#ffffffd9;--ink:#1f2a44;--mute:#5b6784;--pri:#3b82c4;--pri2:#7cc4f0;--acc:#f0a54a;--line:#d7e3f2;--wave:#cfe6fb;--inp:#fff}
[data-theme=dark]{--bg1:#14173a;--bg2:#1c2147;--bg3:#101a33;--card:#232a55d9;--ink:#e9ecff;--mute:#aab3dd;--pri:#8b9bff;--pri2:#5b6ad6;--acc:#ffc46b;--line:#394080;--wave:#262d63;--inp:#171c42}
[data-theme=royal]{--bg1:#0b1d46;--bg2:#12295e;--bg3:#0a1634;--card:#13265ad9;--ink:#fdf3d2;--mute:#d9c58a;--pri:#e5b94a;--pri2:#b98a1e;--acc:#ffd86b;--line:#4b5a8c;--wave:#17326f;--inp:#0d1c46}
[data-theme=mint]{--bg1:#e4fbf1;--bg2:#f3fff9;--bg3:#e2f6f8;--card:#ffffffdd;--ink:#16372f;--mute:#4f7a6c;--pri:#1fa37a;--pri2:#7fe0b9;--acc:#f2b84b;--line:#c5ebdb;--wave:#bdf0d9;--inp:#fff}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Malayalam","Nirmala UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));min-height:100vh;line-height:1.5;position:relative;overflow-x:hidden;background-size:220% 220%;animation:bgshift 60s ease-in-out infinite alternate}
.bgwaves{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgwaves svg{position:absolute;left:0;width:200%;height:46vh;min-height:220px}
.bgwaves path{fill:var(--pri2)}
.w1{bottom:-2vh;opacity:.30;animation:flow 70s linear infinite}
.w2{bottom:7vh;opacity:.20;animation:flow 110s linear infinite reverse}
.w3{bottom:17vh;opacity:.13;animation:flow 150s linear infinite}
.w4{top:-8vh;transform:scaleY(-1);opacity:.16;animation:flow 130s linear infinite reverse}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.w4{animation-name:flow4}@keyframes flow4{from{transform:scaleY(-1) translateX(0)}to{transform:scaleY(-1) translateX(-50%)}}
.tgrid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1rem .8rem;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0002}
.tmedal{display:block}.tcard .tmedal{display:block;margin:0 auto .35rem;width:68px;height:auto}
.tph{width:92px;height:92px;border-radius:50%;margin:0 auto .5rem;background:linear-gradient(135deg,var(--pri),var(--acc));display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;color:#fff;overflow:hidden;border:3px solid var(--acc)}
.tph img{width:100%;height:100%;object-fit:cover}.tph.big{width:150px;height:150px;font-size:3.4rem;margin:1rem auto}.tph.huge{width:calc(min(16vw,150px)*var(--f,1));height:calc(min(16vw,150px)*var(--f,1));font-size:calc(3rem*var(--f,1));margin:0 auto .4rem}
.lvl{display:inline-block;border-radius:99px;padding:.1rem .7rem;font-size:.74rem;font-weight:700;color:#fff}
.lv-national{background:linear-gradient(135deg,#ff9933,#d9731a)}.lv-state{background:linear-gradient(135deg,#3b82c4,#1d4f91)}.lv-institute{background:linear-gradient(135deg,#1fa37a,#0f7a5a)}
.tier{font-weight:800;letter-spacing:.04em}.tier1{color:#7c93ad}.tier2{color:#c58f17}.tier3{color:#8a8a8a}
#proj{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 115%,#4a2f8f 0%,#171d57 45%,#070a22 100%);color:#fff;overflow:hidden;display:flex;flex-direction:column;font-family:inherit}
#proj .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 62%,#ffffff12 0 7deg,transparent 7deg 18deg);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spark{position:absolute;border-radius:50%;background:#ffe08a;opacity:0;animation:twinkle 4s ease-in-out infinite;box-shadow:0 0 10px #ffe08a}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.95;transform:scale(1.3)}}
#proj>*{position:relative}#proj .rays,#proj .spark{position:absolute}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;gap:1rem}
.ptitle{font-size:clamp(1.3rem,3.2vw,2.6rem);font-weight:800;text-shadow:0 2px 18px #ffd86b88}.ptitle small{font-size:.5em;opacity:.8}
.pctl{display:flex;gap:.5rem}#proj button.ghost{color:#fff;border-color:#ffffff55}
.pmain{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:0 1rem;cursor:pointer}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.2rem;width:100%;max-width:1100px}
.pcol{flex:1 1 0;width:0;min-width:0;max-width:320px;text-align:center}.pcol .pname{overflow-wrap:break-word}
.pcard{min-height:30vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:.5rem}
.pcard.ghostc{font-size:4rem;opacity:.25;justify-content:center}
.pname{font-size:calc(clamp(1.2rem,2.6vw,2.3rem)*var(--f,1));font-weight:800;line-height:1.15;text-shadow:0 2px 12px #000a}
.psub{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:clamp(1rem,1.8vw,1.5rem);font-weight:700;color:#ffe08a}.psub2{opacity:.85}
.pbase{border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:.4rem;font-size:clamp(2rem,5vw,4rem);font-weight:900;color:#0000006b;box-shadow:0 -4px 30px #ffffff30 inset}
.pb1{height:32vh;background:linear-gradient(#ffe48f,#c38b12)}.pb2{height:24vh;background:linear-gradient(#f4f5f7,#8b9097)}.pb3{height:17vh;background:linear-gradient(#e2a46a,#8a4d17)}
.pop{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}@keyframes pop{from{transform:translateY(60px) scale(.5);opacity:0}to{transform:none;opacity:1}}
.pfoot{padding:.6rem 1.5rem 1rem;text-align:center}.pmsg{font-size:clamp(1rem,2.2vw,1.8rem);font-weight:600;margin-bottom:.6rem;text-shadow:0 2px 10px #000a}
.phint{font-size:.8rem;opacity:.7}.phint button{padding:.1rem .6rem;font-size:.8rem}
.pfinal{margin:auto;text-align:center;font-size:clamp(2rem,6vw,5rem);font-weight:900;line-height:1.2;text-shadow:0 4px 30px #ffd86b}
@media print{#proj{display:none!important}}
@media(prefers-reduced-motion:reduce){#proj .rays,.spark{animation:none!important}}
@keyframes bgshift{from{background-position:0% 0%}to{background-position:100% 100%}}
@media(prefers-reduced-motion:reduce){.bgwaves svg,body{animation:none!important}}
header{position:relative;z-index:20;background:var(--card);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.5rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
header h1{font-size:1.05rem;margin:0;flex:1 1 260px;line-height:1.25}
header h1 small{display:block;font-weight:500;color:var(--mute);font-size:.75rem}
.tools{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:.45rem .7rem;width:100%}
.tools select,.tools input{width:auto}
button{cursor:pointer;border:0;border-radius:999px;padding:.45rem 1rem;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600}
.attrow{display:flex;gap:.8rem;margin:.3rem 0 .8rem}.attbtn{flex:1;font-size:1.15rem;font-weight:800;padding:1rem .6rem;border-radius:16px;background:#fff!important;border:3px solid;cursor:pointer}.attbtn.yes{border-color:#1f9d55;color:#1f9d55!important}.attbtn.no{border-color:#d64545;color:#d64545!important}.attbtn.yes.on{background:#1f9d55!important;color:#fff!important}.attbtn.no.on{background:#d64545!important;color:#fff!important}@media(max-width:520px){.attrow{flex-direction:column}}.attrow.sel .attbtn:not(.on){border-color:#c4c7cf!important;color:#9a9fab!important;background:#eceef2!important;font-weight:600}
[data-theme=royal] button{color:#0b1d46}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button.sm{padding:.2rem .6rem;font-size:.8rem}
button.danger{background:#d9534f;color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border-radius:0;background:transparent;color:var(--ink);padding:.3rem .7rem}
.seg button.on{background:var(--pri);color:#fff}
[data-theme=royal] .seg button.on{color:#0b1d46}
nav{position:relative;z-index:2;display:flex;gap:.4rem;flex-wrap:wrap;padding:.6rem 1rem}
nav button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
[data-theme=royal] nav button.on{color:#0b1d46}
[data-theme=royal] nav button:not(.on),[data-theme=royal] button.ghost{color:var(--ink)}
main{position:relative;z-index:1;max-width:1150px;margin:0 auto;padding:0 1rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.1rem 1.2rem;margin:1rem 0;box-shadow:0 8px 28px #0000000f;backdrop-filter:blur(6px)}
.card h2{margin:.1rem 0 .6rem;font-size:1.25rem}.card h3{margin:.8rem 0 .3rem;font-size:1.05rem}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;position:relative;overflow:hidden;padding-bottom:2.8rem}
[data-theme=royal] .hero{color:#0b1d46}
.hero h2{font-size:1.6rem}.hero svg{position:absolute;left:0;bottom:-1px;width:100%;height:46px}
.chip{display:inline-block;background:#ffffff33;border-radius:999px;padding:.15rem .8rem;margin:.15rem .25rem .15rem 0;font-weight:600;font-size:.85rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.wave{display:block;width:100%;height:50px;margin:.5rem 0;color:var(--wave)}
.tl{list-style:none;margin:0;padding:0 0 0 1.2rem;border-left:3px solid var(--pri)}
.tl li{position:relative;margin:0 0 1rem;padding:.6rem .9rem;background:var(--inp);border-radius:16px;border:1px solid var(--line)}
.tl li:before{content:"";position:absolute;left:-1.78rem;top:.9rem;width:.9rem;height:.9rem;border-radius:50%;background:var(--acc);border:3px solid var(--bg1)}
.tl b.t{color:var(--pri)}
label{display:block;font-weight:600;font-size:.88rem;margin:.6rem 0 .2rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1 1 200px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.scroll{overflow-x:auto}
.msg{padding:.6rem .9rem;border-radius:14px;margin:.6rem 0}.ok{background:#2fb56a26;border:1px solid #2fb56a}.err{background:#e5484d22;border:1px solid #e5484d}.info{background:var(--inp);border:1px dashed var(--pri)}
.pill{display:inline-block;border-radius:99px;padding:.05rem .6rem;font-size:.75rem;font-weight:700;background:var(--pri);color:#fff}
[data-theme=royal] .pill{color:#0b1d46}
.pass{border:2px dashed var(--acc);border-radius:24px;padding:1.2rem;text-align:center}
.pass .id{font-family:monospace;font-size:1.3rem;letter-spacing:.08em;color:var(--pri)}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal>div{background:var(--bg1);color:var(--ink);border-radius:20px;max-width:720px;width:100%;padding:1.2rem;max-height:90vh;overflow:auto;border:1px solid var(--line)}
[data-theme=royal] .modal>div{background:#0f2250}[data-theme=dark] .modal>div{background:#1a1f48}
.modal textarea{height:260px;font-family:monospace;font-size:.8rem}
.subnav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
footer{position:relative;z-index:1;text-align:center;color:var(--mute);font-size:.8rem;padding:1.5rem 1rem}
.hide-print{}
@media print{.blob,header,nav,footer,.hide-print{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #999;background:#fff}}
@media(max-width:600px){.hero h2{font-size:1.3rem}}
</style>
</head>

    const last=FSR.last[c.n]||new Map();
    cur.forEach((v,id)=>{if(last.get(id)!==v.json)ops.push(['set',c.n,id,JSON.parse(JSON.stringify(v.data))])});
    last.forEach((_,id)=>{if(!cur.has(id))ops.push(['del',c.n,id])});
    FSR.last[c.n]=new Map([...cur].map(([id,v])=>[id,v.json]))}
  const st=Object.assign({},S.settings);const img=st.schedImg||'';delete st.schedImg;const sj=canon(st);
  if(FSR.last.settings!==sj){ops.push(['set','meta','settings',JSON.parse(JSON.stringify(st))]);FSR.last.settings=sj}
  if(FSR.last.sched!==img){ops.push(['set','meta','sched',{img}]);FSR.last.sched=img}
  for(let i=0;i<ops.length;i+=400){const b=FSR.db.batch();ops.slice(i,i+400).forEach(([t,c,id,d])=>{const r=FSR.db.collection(c).doc(id);t==='set'?b.set(r,d):b.delete(r)});b.commit().catch(e=>console.warn('sync write failed',e))}
}

function fsMark(name){FSR.loaded.add(name);if(!FSR.ready&&FSR.loaded.size>=FS_COLS.length+2){FSR.ready=true;fbDoc=FSR.db;try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}softRender()}}
function fsListen(){
  const db=FSR.db;
  FS_COLS.forEach(c=>db.collection(c.n).onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const arr=[],last=new Map();snap.forEach(d=>{const data=d.data();arr.push(data);last.set(d.id,canon(data))});
    if(c.ordered)arr.sort((a,b)=>(a._o||0)-(b._o||0));
    const clean=c.ordered?arr.map(x=>{const y=Object.assign({},x);delete y._o;return y}):arr;
    c.set(clean);FSR.last[c.n]=last;
    if(c.n==='users'&&me&&!curUser()&&FSR.ready){/* session user removed remotely */}
    if(!FSR.ready)fsMark(c.n);else{try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}softRender()}},e=>console.warn('listen failed',c.n,e)));
  db.doc('meta/settings').onSnapshot(snap=>{if(snap.metadata.hasPendingWrites||!snap.exists)return;const keep=S.settings.schedImg;const d=snap.data();FSR.last.settings=canon(d);S.settings=Object.assign({},d,{schedImg:keep||''});ensureDefaults();if(!FSR.ready)fsMark('settings');else softRender()});
  db.doc('meta/sched').onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;const img=snap.exists?(snap.data().img||''):'';FSR.last.sched=img;S.settings.schedImg=img;if(!FSR.ready)fsMark('sched');else softRender()});
}
