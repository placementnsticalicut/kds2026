<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaushal Deekshant Samaroh 2026 — NSTI Calicut Coordination Portal</title>
<style>
:root{--fs:16px}
[data-theme=light]{--bg1:#eaf4ff;--bg2:#fff6e6;--bg3:#e9fbf3;--card:#ffffffd9;--ink:#1f2a44;--mute:#5b6784;--pri:#3b82c4;--pri2:#7cc4f0;--acc:#f0a54a;--line:#d7e3f2;--wave:#cfe6fb;--inp:#fff}
[data-theme=dark]{--bg1:#14173a;--bg2:#1c2147;--bg3:#101a33;--card:#232a55d9;--ink:#e9ecff;--mute:#aab3dd;--pri:#8b9bff;--pri2:#5b6ad6;--acc:#ffc46b;--line:#394080;--wave:#262d63;--inp:#171c42}
[data-theme=royal]{--bg1:#0b1d46;--bg2:#12295e;--bg3:#0a1634;--card:#13265ad9;--ink:#fdf3d2;--mute:#d9c58a;--pri:#e5b94a;--pri2:#b98a1e;--acc:#ffd86b;--line:#4b5a8c;--wave:#17326f;--inp:#0d1c46}
[data-theme=mint]{--bg1:#e4fbf1;--bg2:#f3fff9;--bg3:#e2f6f8;--card:#ffffffdd;--ink:#16372f;--mute:#4f7a6c;--pri:#1fa37a;--pri2:#7fe0b9;--acc:#f2b84b;--line:#c5ebdb;--wave:#bdf0d9;--inp:#fff}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Malayalam","Nirmala UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));min-height:100vh;line-height:1.5;position:relative;overflow-x:hidden;background-size:220% 220%;animation:bgshift 60s ease-in-out infinite alternate}
.bgwaves{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgwaves svg{position:absolute;left:0;width:200%;height:46vh;min-height:220px}
.bgwaves path{fill:var(--pri2)}
.w1{bottom:-2vh;opacity:.30;animation:flow 70s linear infinite}
.w2{bottom:7vh;opacity:.20;animation:flow 110s linear infinite reverse}
.w3{bottom:17vh;opacity:.13;animation:flow 150s linear infinite}
.w4{top:-8vh;transform:scaleY(-1);opacity:.16;animation:flow 130s linear infinite reverse}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.w4{animation-name:flow4}@keyframes flow4{from{transform:scaleY(-1) translateX(0)}to{transform:scaleY(-1) translateX(-50%)}}
.tgrid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1rem .8rem;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0002}
.tmedal{display:block}.tcard .tmedal{display:block;margin:0 auto .35rem;width:68px;height:auto}
.tph{width:92px;height:92px;border-radius:50%;margin:0 auto .5rem;background:linear-gradient(135deg,var(--pri),var(--acc));display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;color:#fff;overflow:hidden;border:3px solid var(--acc)}
.tph img{width:100%;height:100%;object-fit:cover}.tph.big{width:150px;height:150px;font-size:3.4rem;margin:1rem auto}.tph.huge{width:min(16vw,150px);height:min(16vw,150px);font-size:3rem;margin:0 auto .4rem}
.lvl{display:inline-block;border-radius:99px;padding:.1rem .7rem;font-size:.74rem;font-weight:700;color:#fff}
.lv-national{background:linear-gradient(135deg,#ff9933,#d9731a)}.lv-state{background:linear-gradient(135deg,#3b82c4,#1d4f91)}.lv-institute{background:linear-gradient(135deg,#1fa37a,#0f7a5a)}
.tier{font-weight:800;letter-spacing:.04em}.tier1{color:#7c93ad}.tier2{color:#c58f17}.tier3{color:#8a8a8a}
#proj{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 115%,#4a2f8f 0%,#171d57 45%,#070a22 100%);color:#fff;overflow:hidden;display:flex;flex-direction:column;font-family:inherit}
#proj .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 62%,#ffffff12 0 7deg,transparent 7deg 18deg);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spark{position:absolute;border-radius:50%;background:#ffe08a;opacity:0;animation:twinkle 4s ease-in-out infinite;box-shadow:0 0 10px #ffe08a}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.95;transform:scale(1.3)}}
#proj>*{position:relative}#proj .rays,#proj .spark{position:absolute}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;gap:1rem}
.ptitle{font-size:clamp(1.3rem,3.2vw,2.6rem);font-weight:800;text-shadow:0 2px 18px #ffd86b88}.ptitle small{font-size:.5em;opacity:.8}
.pctl{display:flex;gap:.5rem}#proj button.ghost{color:#fff;border-color:#ffffff55}
.pmain{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:0 1rem;cursor:pointer}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.2rem;width:100%;max-width:1100px}
.pcol{flex:1 1 0;max-width:320px;text-align:center}
.pcard{min-height:30vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:.5rem}
.pcard.ghostc{font-size:4rem;opacity:.25;justify-content:center}
.pname{font-size:clamp(1.2rem,2.6vw,2.3rem);font-weight:800;line-height:1.15;text-shadow:0 2px 12px #000a}
.psub{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:clamp(1rem,1.8vw,1.5rem);font-weight:700;color:#ffe08a}.psub2{opacity:.85}
.pbase{border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:.4rem;font-size:clamp(2rem,5vw,4rem);font-weight:900;color:#0000006b;box-shadow:0 -4px 30px #ffffff30 inset}
.pb1{height:32vh;background:linear-gradient(#ffe48f,#c38b12)}.pb2{height:24vh;background:linear-gradient(#f4f5f7,#8b9097)}.pb3{height:17vh;background:linear-gradient(#e2a46a,#8a4d17)}
.pop{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}@keyframes pop{from{transform:translateY(60px) scale(.5);opacity:0}to{transform:none;opacity:1}}
.pfoot{padding:.6rem 1.5rem 1rem;text-align:center}.pmsg{font-size:clamp(1rem,2.2vw,1.8rem);font-weight:600;margin-bottom:.6rem;text-shadow:0 2px 10px #000a}
.phint{font-size:.8rem;opacity:.7}.phint button{padding:.1rem .6rem;font-size:.8rem}
.pfinal{margin:auto;text-align:center;font-size:clamp(2rem,6vw,5rem);font-weight:900;line-height:1.2;text-shadow:0 4px 30px #ffd86b}
@media print{#proj{display:none!important}}
@media(prefers-reduced-motion:reduce){#proj .rays,.spark{animation:none!important}}
@keyframes bgshift{from{background-position:0% 0%}to{background-position:100% 100%}}
@media(prefers-reduced-motion:reduce){.bgwaves svg,body{animation:none!important}}
header{position:relative;z-index:20;background:var(--card);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.5rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
header h1{font-size:1.05rem;margin:0;flex:1 1 260px;line-height:1.25}
header h1 small{display:block;font-weight:500;color:var(--mute);font-size:.75rem}
.tools{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:.45rem .7rem;width:100%}
.tools select,.tools input{width:auto}
button{cursor:pointer;border:0;border-radius:999px;padding:.45rem 1rem;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600}
[data-theme=royal] button{color:#0b1d46}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button.sm{padding:.2rem .6rem;font-size:.8rem}
button.danger{background:#d9534f;color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border-radius:0;background:transparent;color:var(--ink);padding:.3rem .7rem}
.seg button.on{background:var(--pri);color:#fff}
[data-theme=royal] .seg button.on{color:#0b1d46}
nav{position:relative;z-index:2;display:flex;gap:.4rem;flex-wrap:wrap;padding:.6rem 1rem}
nav button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
[data-theme=royal] nav button.on{color:#0b1d46}
[data-theme=royal] nav button:not(.on),[data-theme=royal] button.ghost{color:var(--ink)}
main{position:relative;z-index:1;max-width:1150px;margin:0 auto;padding:0 1rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.1rem 1.2rem;margin:1rem 0;box-shadow:0 8px 28px #0000000f;backdrop-filter:blur(6px)}
.card h2{margin:.1rem 0 .6rem;font-size:1.25rem}.card h3{margin:.8rem 0 .3rem;font-size:1.05rem}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;position:relative;overflow:hidden;padding-bottom:2.8rem}
[data-theme=royal] .hero{color:#0b1d46}
.hero h2{font-size:1.6rem}.hero svg{position:absolute;left:0;bottom:-1px;width:100%;height:46px}
.chip{display:inline-block;background:#ffffff33;border-radius:999px;padding:.15rem .8rem;margin:.15rem .25rem .15rem 0;font-weight:600;font-size:.85rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.wave{display:block;width:100%;height:50px;margin:.5rem 0;color:var(--wave)}
.tl{list-style:none;margin:0;padding:0 0 0 1.2rem;border-left:3px solid var(--pri)}
.tl li{position:relative;margin:0 0 1rem;padding:.6rem .9rem;background:var(--inp);border-radius:16px;border:1px solid var(--line)}
.tl li:before{content:"";position:absolute;left:-1.78rem;top:.9rem;width:.9rem;height:.9rem;border-radius:50%;background:var(--acc);border:3px solid var(--bg1)}
.tl b.t{color:var(--pri)}
label{display:block;font-weight:600;font-size:.88rem;margin:.6rem 0 .2rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1 1 200px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.scroll{overflow-x:auto}
.msg{padding:.6rem .9rem;border-radius:14px;margin:.6rem 0}.ok{background:#2fb56a26;border:1px solid #2fb56a}.err{background:#e5484d22;border:1px solid #e5484d}.info{background:var(--inp);border:1px dashed var(--pri)}
.pill{display:inline-block;border-radius:99px;padding:.05rem .6rem;font-size:.75rem;font-weight:700;background:var(--pri);color:#fff}
[data-theme=royal] .pill{color:#0b1d46}
.pass{border:2px dashed var(--acc);border-radius:24px;padding:1.2rem;text-align:center}
.pass .id{font-family:monospace;font-size:1.3rem;letter-spacing:.08em;color:var(--pri)}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal>div{background:var(--bg1);color:var(--ink);border-radius:20px;max-width:720px;width:100%;padding:1.2rem;max-height:90vh;overflow:auto;border:1px solid var(--line)}
[data-theme=royal] .modal>div{background:#0f2250}[data-theme=dark] .modal>div{background:#1a1f48}
.modal textarea{height:260px;font-family:monospace;font-size:.8rem}
.subnav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
footer{position:relative;z-index:1;text-align:center;color:var(--mute);font-size:.8rem;padding:1.5rem 1rem}
.hide-print{}
@media print{.blob,header,nav,footer,.hide-print{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #999;background:#fff}}
@media(max-width:600px){.hero h2{font-size:1.3rem}}
</style>
</head>

    const last=FSR.last[c.n]||new Map();
    cur.forEach((v,id)=>{if(last.get(id)!==v.json)ops.push(['set',c.n,id,JSON.parse(JSON.stringify(v.data))])});
    last.forEach((_,id)=>{if(!cur.has(id))ops.push(['del',c.n,id])});
    FSR.last[c.n]=new Map([...cur].map(([id,v])=>[id,v.json]))}
  const st=Object.assign({},S.settings);const img=st.schedImg||'';delete st.schedImg;const sj=canon(st);
  if(FSR.last.settings!==sj){ops.push(['set','meta','settings',JSON.parse(JSON.stringify(st))]);FSR.last.settings=sj}
  if(FSR.last.sched!==img){ops.push(['set','meta','sched',{img}]);FSR.last.sched=img}
  for(let i=0;i<ops.length;i+=400){const b=FSR.db.batch();ops.slice(i,i+400).forEach(([t,c,id,d])=>{const r=FSR.db.collection(c).doc(id);t==='set'?b.set(r,d):b.delete(r)});b.commit().catch(e=>console.warn('sync write failed',e))}
}

function fsMark(name){FSR.loaded.add(name);if(!FSR.ready&&FSR.loaded.size>=FS_COLS.length+2){FSR.ready=true;fbDoc=FSR.db;try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}softRender()}}
function fsListen(){
  const db=FSR.db;
  FS_COLS.forEach(c=>db.collection(c.n).onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const arr=[],last=new Map();snap.forEach(d=>{const data=d.data();arr.push(data);last.set(d.id,canon(data))});
    if(c.ordered)arr.sort((a,b)=>(a._o||0)-(b._o||0));
    const clean=c.ordered?arr.map(x=>{const y=Object.assign({},x);delete y._o;return y}):arr;
    c.set(clean);FSR.last[c.n]=last;
    if(c.n==='users'&&me&&!curUser()&&FSR.ready){/* session user removed remotely */}
    if(!FSR.ready)fsMark(c.n);else{try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}softRender()}},e=>console.warn('listen failed',c.n,e)));
  db.doc('meta/settings').onSnapshot(snap=>{if(snap.metadata.hasPendingWrites||!snap.exists)return;const keep=S.settings.schedImg;const d=snap.data();FSR.last.settings=canon(d);S.settings=Object.assign({},d,{schedImg:keep||''});ensureDefaults();if(!FSR.ready)fsMark('settings');else softRender()});
  db.doc('meta/sched').onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;const img=snap.exists?(snap.data().img||''):'';FSR.last.sched=img;S.settings.schedImg=img;if(!FSR.ready)fsMark('sched');else softRender()});
}

let prQ='',prTrade='';
function prRows(){const q=prQ.toLowerCase();return trainees().filter(u=>(!prTrade||u.trade===prTrade)&&(!q||(u.name+' '+u.reg).toLowerCase().includes(q))).sort((a,b)=>(a.trade||'').localeCompare(b.trade||'')||a.name.localeCompare(b.name))}
function prTable(){const rows=prRows().slice(0,300);const conf=new Set(S.confirmations.map(c=>c.key));
  return `<div class="scroll"><table><tr><th>${T('reg')}</th><th>${T('name')}</th><th>${T('trade')}</th><th>${T('participated')}</th><th>${T('pres_state')}</th><th>${T('tp_noshow')}</th></tr>
  ${rows.map(u=>{const k=ukey(u),a=S.attendance[k];return `<tr><td>${esc(u.reg)}</td><td>${esc(u.name)}</td><td>${esc(u.scheme)} · ${esc(u.trade)}</td><td>${conf.has(k)?'✓':'—'}</td><td>${a?`<span class="pill">✓ ${new Date(a.at).toLocaleTimeString()}</span> <small style="color:var(--mute)">${T(a.method==='qr'?'pres_qr':'pres_manual')} ${T('pres_by')} ${esc(a.by)}</small> <button class="ghost sm" data-k="${esc(k)}" onclick="togglePres(this.dataset.k)">${T('pres_undo')}</button>`:`<button class="sm" data-k="${esc(k)}" onclick="togglePres(this.dataset.k)">${T('pres_mark')}</button>`}</td><td><input type="checkbox" style="width:auto" data-k="${esc(k)}" ${u.noShow?'checked':''} onchange="toggleNoShow(this.dataset.k)"></td></tr>`}).join('')||`<tr><td colspan="6">${T('nodata')}</td></tr>`}</table></div>`}
function presView(){const all=trainees();const p=all.filter(u=>S.attendance[ukey(u)]).length;
  return `<h2>📍 ${T('pres_h')}</h2><p><b>${T('pres_sum',{p,t:all.length})}</b></p>
  <div class="row hide-print"><button onclick="startScan()" style="flex:0 0 auto">📷 ${T('pres_scan')}</button><input placeholder="${T('tr_search')}" value="${esc(prQ)}" oninput="prQ=this.value;updPres()"><select onchange="prTrade=this.value;updPres()"><option value="">${T('all')}</option>${allTrades().map(t=>`<option ${t===prTrade?'selected':''}>${esc(t)}</option>`).join('')}</select><button class="ghost" style="flex:0 0 auto" onclick="exportPres()">${T('pres_export')}</button></div><div id="prTbl">${prTable()}</div>`}
function updPres(){const e=$('#prTbl');if(e)e.innerHTML=prTable()}
function markPresent(k,method){if(S.attendance[k])return false;S.attendance[k]={at:Date.now(),by:curUser().name,method};persist();return true}
function togglePres(k){if(S.attendance[k]){delete S.attendance[k];persist()}else markPresent(k,'manual');render()}
function exportPres(){exportCSV(S.settings.code+'_venue_attendance',[['Reg No','Name','Scheme','Trade','Mobile','Present','Time','Method','Marked By'],...trainees().sort((a,b)=>(a.trade||'').localeCompare(b.trade||'')).map(u=>{const a=S.attendance[ukey(u)];return [u.reg,u.name,u.scheme,u.trade,u.mobile,a?'Yes':'No',a?new Date(a.at).toLocaleString():'',a?a.method:'',a?a.by:'']})])}
let scanStream=null,scanTimer=null,lastScan='',lastScanAt=0;
async function startScan(){
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){modal(`<div class="msg info">${T('sc_unsupported')}</div><p><button onclick="closeModal()">${T('close')}</button></p>`);return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){modal(`<div class="msg info">${T('sc_unsupported')}</div><p><button onclick="closeModal()">${T('close')}</button></p>`);return}
  modal(`<p>${T('sc_hint')}</p><video id="scv" autoplay playsinline muted style="width:100%;border-radius:14px;background:#000"></video><div id="scMsg" class="msg info">…</div><p><button onclick="stopScan()">${T('sc_stop')}</button></p>`);
  const v=$('#scv');v.srcObject=scanStream;const det=new BarcodeDetector({formats:['qr_code']});
  scanTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)handleScan(r[0].rawValue)}catch(e){}},400)}
function handleScan(raw){const now=Date.now();if(raw===lastScan&&now-lastScanAt<3000)return;lastScan=raw;lastScanAt=now;const u=verifyPayload(raw),m=$('#scMsg');
  if(!u||u.role!=='trainee'){m.className='msg err';m.textContent=T('sc_bad');return}
  if(markPresent(ukey(u),'qr')){m.className='msg ok';m.textContent=T('sc_ok',{n:u.name})}else{m.className='msg info';m.textContent=T('sc_dup',{n:u.name})}}
function stopScan(){clearInterval(scanTimer);if(scanStream)scanStream.getTracks().forEach(t=>t.stop());scanStream=null;closeModal();render()}

function cultView(){const can=canCult();return `<h2>🎭 ${T('cult_h')}</h2><p style="color:var(--mute)">${T('cult_note')}</p>
  ${can?`<form onsubmit="saveCult(event)"><input type="hidden" id="c_id"><div class="row"><div><label>${T('cult_prog')} *</label><input id="c_name"></div><div style="flex:2 1 300px"><label>${T('cult_part')} *</label><input id="c_part"></div><div><label>${T('cult_time')}</label><input id="c_time"></div></div><p><button>${T('save')}</button></p></form>`:''}
  <div class="scroll"><table><tr><th>#</th><th>${T('cult_prog')}</th><th>${T('cult_part')}</th><th>${T('cult_time')}</th><th>${T('cult_by')}</th>${can?'<th></th>':''}</tr>
  ${S.cultural.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.participants)}</td><td>${esc(x.time||'')}</td><td>${esc(x.by||'')}</td>${can?`<td style="white-space:nowrap"><button class="ghost sm" onclick="mvCult(${x.id},-1)">↑</button> <button class="ghost sm" onclick="mvCult(${x.id},1)">↓</button> <button class="ghost sm" onclick="editCult(${x.id})">${T('edit')}</button> <button class="danger sm" onclick="delCult(${x.id})">${T('del')}</button></td>`:''}</tr>`).join('')||`<tr><td colspan="6">${T('nodata')}</td></tr>`}</table></div>`}
function saveCult(e){e.preventDefault();if(!canCult())return;const n=$('#c_name').value.trim(),p=$('#c_part').value.trim();if(!n||!p)return;const id=+$('#c_id').value;
  if(id){const x=S.cultural.find(y=>y.id===id);if(x){x.name=n;x.participants=p;x.time=$('#c_time').value.trim()}}else S.cultural.push({id:Date.now(),name:n,participants:p,time:$('#c_time').value.trim(),by:curUser().name});persist();render()}
function editCult(id){const x=S.cultural.find(y=>y.id===id);if(!x)return;$('#c_id').value=x.id;$('#c_name').value=x.name;$('#c_part').value=x.participants;$('#c_time').value=x.time||''}
function delCult(id){if(!canCult())return;S.cultural=S.cultural.filter(x=>x.id!==id);persist();render()}
function mvCult(id,d){const i=S.cultural.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=S.cultural.length)return;[S.cultural[i],S.cultural[j]]=[S.cultural[j],S.cultural[i]];persist();render()}
function toggleCk(id){const c=S.checklist.find(x=>x.id===id);c.done=!c.done;persist();render()}
function addNote(e){e.preventDefault();const v=$('#n_txt').value.trim();if(!v)return;S.notes.push({id:Date.now(),text:v,by:curUser().name,at:Date.now()});persist();render()}
function delNote(id){S.notes=S.notes.filter(n=>n.id!==id);persist();render()}
function attRows(){return S.confirmations.filter(c=>!attTrade||c.trade===attTrade).sort((a,b)=>(a.trade||'').localeCompare(b.trade||'')||a.name.localeCompare(b.name))}

function importRoster(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const cnt=ch=>first.split(ch).length-1;const delim=cnt(',')>=cnt(';')&&cnt(',')>=cnt('\t')?',':(cnt(';')>=cnt('\t')?';':'\t');
  let rows=parseCSV(text,delim);if(rows.length&&/reg/i.test(rows[0][0]||''))rows.shift();
  let add=0,upd=0;const bad=[],unl=new Set();
  rows.forEach((p,i)=>{p=p.map(x=>x.trim());const [reg,name,scheme,trade,mob,dob,batch]=p;const m=normMob(mob)||'',d=normDob(dob);
    const sc=['CTS','CITS','Other'].find(s=>s.toLowerCase()===(scheme||'').toLowerCase());
    const tm=(sc&&trade)?matchTrade(sc,trade):null;
    const miss=!reg?'Reg No':!name?'Name':!sc?'Scheme':!trade?'Trade':!tm?'Trade "'+trade+'" not in admin list ('+sc+')':(mob&&!m)?'Mobile (invalid)':!d?'DOB':'';
    if(miss){if(sc&&trade&&!tm)unl.add(sc+' · '+trade);bad.push('Row '+(i+1)+': '+miss);return}
    const u={reg,name,scheme:sc,trade:tm,mobile:m,dob:d,batch:batch||'',role:'trainee',cert:'Pending'};
    const k=S.users.findIndex(x=>x.role==='trainee'&&String(x.reg).toLowerCase()===reg.toLowerCase());
    if(k>=0){const o=S.users[k];u.cert=o.cert||'Pending';if(o.certAt)u.certAt=o.certAt;if(o.certBy)u.certBy=o.certBy;S.users[k]=u;upd++}else{S.users.push(u);add++}});
  return{add,upd,bad,unl:[...unl]}}
function runImport(text){if(!String(text||'').trim()){flash={t:'err',m:'Nothing to import: the file or paste box is empty. No changes were made.'};render();return}
  const r=importRoster(text);persist();if(!r.add&&!r.upd&&!r.bad.length){flash={t:'err',m:'No trainee rows were found in the data (only a header or blank lines). No changes were made.'};render();return}flash={t:(r.bad.length&&!r.add&&!r.upd)?'err':'ok',m:`Added ${r.add}, updated ${r.upd}, rejected ${r.bad.length}`+(r.bad.length?' — '+r.bad.filter(x=>!/not in admin list/.test(x)).slice(0,6).join('; '):'')+(r.unl.length?' — Trade not in admin list: '+r.unl.slice(0,8).join('; ')+'. Add it under Admin → Settings → Trades, or map it below, then upload again.':'')};render()}

/* ---- image sharing of toppers (individual / trade podium / poster) ---- */
const TPF="'Segoe UI','Noto Sans','Noto Sans Devanagari','Noto Sans Malayalam',sans-serif";
function wrapT(x,text,maxW,maxLines){const words=String(text).split(/\s+/);const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/.{0,2}$/,'…')}return lines}
function fitT(x,txt,wt,mx,mn,w){let p=mx;x.font=wt+' '+p+'px '+TPF;while(p>mn&&x.measureText(txt).width>w){p-=2;x.font=wt+' '+p+'px '+TPF}return p}
function tpLoadImg(src){return new Promise(r=>{if(!src)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src})}
function tpBgP(x,W,H,cy){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b1d46');g.addColorStop(.55,'#2a1b66');g.addColorStop(1,'#0a1634');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.translate(W/2,cy);for(let i=0;i<18;i++){x.rotate(Math.PI*2/18);x.fillStyle='rgba(255,255,255,.045)';x.beginPath();x.moveTo(0,0);x.lineTo(-90,-1500);x.lineTo(90,-1500);x.closePath();x.fill()}x.restore();
  for(let i=0;i<70;i++){x.fillStyle='rgba(255,224,138,'+(.2+(i%5)*.12)+')';x.beginPath();x.arc((i*389)%W,(i*617)%H,2+(i%4),0,7);x.fill()}
  x.fillStyle='rgba(229,185,74,.22)';x.beginPath();x.moveTo(0,H-170);x.bezierCurveTo(270,H-270,540,H-70,W,H-190);x.lineTo(W,H);x.lineTo(0,H);x.fill()}
function tpFootP(x,W,H){x.textAlign='center';x.fillStyle='rgba(255,255,255,.8)';x.font='500 30px '+TPF;x.fillText(wrapT(x,S.settings.venue||'',960,1)[0],W/2,H-48)}
function tpPill(x,cx,y,level,txt){const lc={national:['#ff9933','#d9731a'],state:['#3b82c4','#1d4f91'],institute:['#1fa37a','#0f7a5a']}[level]||['#3b82c4','#1d4f91'];x.font='700 38px '+TPF;const pw=x.measureText(txt).width+90;
  let pg=x.createLinearGradient(cx-pw/2,0,cx+pw/2,0);pg.addColorStop(0,lc[0]);pg.addColorStop(1,lc[1]);x.fillStyle=pg;x.beginPath();x.roundRect?x.roundRect(cx-pw/2,y,pw,66,33):x.rect(cx-pw/2,y,pw,66);x.fill();x.fillStyle='#fff';x.textAlign='center';x.fillText(txt,cx,y+46)}
function tpMedalP(x,mx,my,R,rank){const cols={1:['#fff3b0','#b47a0a'],2:['#fbfbfb','#868b92'],3:['#f3c79a','#8a4d17']}[rank];if(!cols)return;
  const k=R/90;x.fillStyle='#c0392b';x.beginPath();x.moveTo(mx-44*k,my-150*k);x.lineTo(mx-6*k,my-150*k);x.lineTo(mx+22*k,my-55*k);x.lineTo(mx-18*k,my-55*k);x.fill();x.fillStyle='#2c5fb3';x.beginPath();x.moveTo(mx+44*k,my-150*k);x.lineTo(mx+6*k,my-150*k);x.lineTo(mx-22*k,my-55*k);x.lineTo(mx+18*k,my-55*k);x.fill();
  let mg=x.createLinearGradient(mx-R,my-R,mx+R,my+R);mg.addColorStop(0,cols[0]);mg.addColorStop(1,cols[1]);x.fillStyle=mg;x.beginPath();x.arc(mx,my,R,0,7);x.fill();x.lineWidth=6*k;x.strokeStyle='rgba(255,255,255,.7)';x.stroke();x.lineWidth=3*k;x.strokeStyle='rgba(0,0,0,.25)';x.beginPath();x.arc(mx,my,R-14*k,0,7);x.stroke();
  x.fillStyle='rgba(0,0,0,.55)';x.textAlign='center';x.font='900 '+Math.round(100*k)+'px Georgia,serif';x.fillText(String(rank),mx,my+34*k)}
function tpPhotoP(x,img,cx,cy,r,name,ring){x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();
  if(img){const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,cx-r,cy-r,2*r,2*r)}else{let ig=x.createLinearGradient(cx-r,cy-r,cx+r,cy+r);ig.addColorStop(0,'#3b82c4');ig.addColorStop(1,'#e5a93c');x.fillStyle=ig;x.fillRect(cx-r,cy-r,2*r,2*r);x.fillStyle='#fff';x.textAlign='center';x.font='700 '+Math.round(r*1.1)+'px '+TPF;x.fillText((name||'?').trim().charAt(0).toUpperCase(),cx,cy+r*.38)}
  x.restore();x.lineWidth=Math.max(5,r*.07);x.strokeStyle=ring||'#e5b94a';x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()}

  x.font='110px '+TPF;x.fillText('🏆',W/2,215);tpPill(x,W/2,245,g.level,T('lv_'+g.level));x.fillStyle='#fff';let tp_=fitT(x,g.trade,800,56,40,980),tl_=[g.trade];if(x.measureText(g.trade).width>980){tp_=40;x.font='800 40px '+TPF;tl_=wrapT(x,g.trade,980,2)}tl_.forEach((s_,i_)=>x.fillText(s_,W/2,365+i_*46));x.fillStyle='rgba(255,255,255,.8)';x.font='500 34px '+TPF;x.fillText(g.scheme||'',W/2,365+(tl_.length-1)*46+46);
  const base=1190,H_={1:290,2:210,3:150},R_={1:118,2:96,3:88},COL={1:['#f6d365','#b47a0a'],2:['#e8eaee','#7d838c'],3:['#e9b98a','#8a4d17']};
  const cnt={1:0,2:0,3:0};g.items.forEach(t=>cnt[t.rank]++);const slots=[2,1,3].reduce((a,k)=>a+Math.max(1,cnt[k]),0),GAP=18,sw=Math.min(320,(W-60-GAP*2)/slots);
  const tw=slots*sw+GAP*2;let cx0=(W-tw)/2;const colX={};[2,1,3].forEach(k=>{const n=Math.max(1,cnt[k]);colX[k]={x:cx0,w:n*sw};cx0+=n*sw+GAP});

    let pg=x.createLinearGradient(0,pt,0,base);pg.addColorStop(0,COL[k][0]);pg.addColorStop(1,COL[k][1]);x.globalAlpha=its.length?1:.3;x.fillStyle=pg;x.fillRect(col.x,pt,col.w,h);x.globalAlpha=1;
    x.fillStyle=its.length?'rgba(0,0,0,.3)':'rgba(0,0,0,.25)';x.font='900 '+(k==1?150:110)+'px Georgia,serif';x.textAlign='center';x.fillText(String(k),col.x+col.w/2,pt+h*.72);
    if(!its.length){const sk=(g.skipped||[]).filter(z=>z.rank===k);if(sk.length){x.fillStyle='rgba(255,255,255,.85)';x.font='600 28px '+TPF;wrapT(x,'★ '+sk.map(z=>z.name).join(', '),col.w-10,2).forEach((s_,j)=>x.fillText(s_,col.x+col.w/2,pt-50+j*34));x.font='500 24px '+TPF;x.fillText(T('au_also',{l:T('lv_'+sk[0].also)}),col.x+col.w/2,pt-6)}return}
    its.forEach(t=>{const i=g.items.indexOf(t),cx=col.x+sw*(its.indexOf(t)+.5),r=Math.min(R_[k],sw*.34);
      x.fillStyle='#fff';const fp=fitT(x,t.name,800,33,20,sw-12);x.font='800 '+fp+'px '+TPF;let nl=wrapT(x,t.name,sw-12,2);if(x.measureText(t.name).width>sw-12){x.font='800 '+Math.max(22,Math.min(fp,28))+'px '+TPF;nl=wrapT(x,t.name,sw-12,2)}
      const lh=Math.round(fp*1.2),ny=pt-24-(nl.length-1)*lh;nl.forEach((s_,j)=>x.fillText(s_,cx,ny+j*lh));
      tpPhotoP(x,imgs[i],cx,ny-fp-6-r+8,r,t.name,COL[k][0])})});
  x.fillStyle='#ffe9a6';x.font='600 42px '+TPF;x.textAlign='center';x.fillText('🎉 '+T('tp_c1'),W/2,1262);tpFootP(x,W,H);return c}

async function tpGenImages(){const lv=$('#si_level').value,tr=$('#si_trade').value,fmt=$('#si_fmt').value;let jobs=[];
  if(fmt==='card'){const scv=$('#si_scheme').value,b=S.toppers.filter(t=>(!lv||t.level===lv)&&(!tr||normTr(t.trade)===normTr(tr))&&(!scv||(scv==='OTHER'?!['CTS','CITS'].includes(tpScU(t)):tpScU(t)===scv))&&!tpNoShow(t));(lv?b:tpMerge(b)).slice(0,60).forEach(t=>jobs.push({n:t.name,f:()=>drawCardP(t)}))}
  else{const gs=projGroups(lv,tr,$('#si_scheme').value).map(g=>Object.assign({},g,{items:g.items.slice().sort((a,b)=>a.rank-b.rank)}));
    if(fmt==='pod')gs.forEach(g=>jobs.push({n:g.trade+'_'+g.level,f:()=>drawPodiumP(Object.assign({},g,{items:g.items.slice().sort((a,b)=>b.rank-a.rank)}))}));
    else{const np=Math.ceil(gs.length/3);for(let p=0;p<np;p++)jobs.push({n:'toppers_'+(p+1),f:()=>drawPosterP(gs.slice(p*3,p*3+3),p+1,np)})}}
  if(!jobs.length){$('#si_err').innerHTML=`<div class="msg err">${T('tp_none')}</div>`;return}
  $('#si_err').innerHTML=`<div class="msg info">${T('tp_wait')}</div>`;TPIMG=[];
  for(const j of jobs){try{const c=await j.f(),b=await cvBlob(c);if(b)TPIMG.push({b,name:(j.n||'topper').replace(/[^\w]+/g,'_')+'.png',url:URL.createObjectURL(b)})}catch(e){}}
  if(!TPIMG.length){$('#si_err').innerHTML=`<div class="msg err">${T('tp_none')}</div>`;return}
  showTpImgs()}
function showTpImgs(){modal(`<h3>🖼️ ${T('tp_shimg')}</h3><p style="color:var(--mute);font-size:.85rem">${esc(T('sh_hint'))}</p><div class="scroll" style="max-height:62vh">${TPIMG.map((m,i)=>`<div style="margin-bottom:1rem"><img src="${m.url}" alt="" style="width:100%;border-radius:12px"><div class="row" style="margin-top:.4rem"><button class="sm" onclick="tpDl(${i})">⬇ ${T('sh_dl')}</button><button class="sm ghost" onclick="tpNat(${i})">📤 ${T('sh_share')}</button></div></div>`).join('')}</div><div class="row"><button class="ghost" onclick="closeModal()">${T('close')}</button></div>`)}
function tpDl(i){const m=TPIMG[i];if(!m)return;try{const a=document.createElement('a');a.href=m.url;a.download=m.name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
async function tpNat(i){const m=TPIMG[i];if(!m)return;try{const f=new File([m.b],m.name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:L(S.settings.title)});else tpDl(i)}catch(e){}}

function buildTopperPage(){
  const tpl=new TextDecoder().decode(Uint8Array.from(atob(TOP_TPL_B64),c=>c.charCodeAt(0)));
  const keys=['tp_present','tp_auto','tp_final','tp_exit','tp_c1','tp_c2','tp_c3','tp_c4','tp_h','lv_all','lv_national','lv_state','lv_institute','tier_1','tier_2','tier_3','tp_trade_all','tp_search','tp_back','tp_default_msg','tp_none','sh_card','sh_link','sh_copied','sh_dl','sh_share','sh_hint','sh_close'];
  const pick=o=>{const r={};keys.forEach(k=>{if(o[k]!=null)r[k]=o[k]});return r};
  const data={title:S.settings.title,venue:S.settings.venue,code:S.settings.code,toppers:tpSorted().map(t=>({pk:'p'+cyrb53(tpPK(t)),id:t.id,name:t.name,trade:t.trade,scheme:t.scheme,level:t.level,rank:t.rank,score:tpSc(t),message:t.message||'',photo:t.photo||''})),i18n:{en:pick(I.en),hi:pick(I.hi),ml:pick(I.ml)}};
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  const ttl=esc(L(S.settings.title)+' — Toppers'),desc=esc('Meet the National, State and Institute toppers of '+L(S.settings.title)+' at '+S.settings.venue);
  return tpl.split('__OGTITLE__').join(ttl).split('__OGDESC__').join(desc).split('__TITLE__').join(ttl).replace('/*__DATA__*/',()=>'const DATA='+json+';')}
function exportTopperPage(){const html=buildTopperPage();window.__tpHtml=html;
  modal(`<h3>🌐 ${T('tp_export')}</h3><p>${T('tp_exp_note')}</p><p><b>${S.toppers.length}</b> · ${(html.length/1024).toFixed(0)} KB</p><div class="row"><button onclick="dlTpPage()">${T('tp_exp_dl')}</button><button class="ghost" onclick="copyTpPage()">${T('tp_exp_copy')}</button><button class="ghost" onclick="closeModal()">${T('close')}</button></div><div id="tpxMsg"></div>`)}
function dlTpPage(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([window.__tpHtml],{type:'text/html'}));a.download=S.settings.code+'_toppers.html';document.body.appendChild(a);a.click();a.remove()}catch(e){}$('#tpxMsg').innerHTML='<div class="msg info">If nothing downloaded (e.g. in the preview), use Copy HTML and save it as a .html file.</div>'}
function copyTpPage(){let ok=false;try{navigator.clipboard.writeText(window.__tpHtml);ok=true}catch(e){}$('#tpxMsg').innerHTML=`<div class="msg ${ok?'ok':'info'}">${ok?T('tp_exp_done'):'Clipboard blocked here — use Download in the hosted file.'}</div>`}

let tpImpMsg=null;
function topperTemplate(){exportCSV('toppers_template',[['Level','Rank','Reg No','Name','Scheme','Trade','Score','Message','Max Marks'],['National','1','','Sample Name One','CTS','Electrician','1057','','1200'],['State','1','','Sample Name Two','CITS','Electronic Mechanic','700','Hearty Congratulations!!','750'],['Institute','2','CTS26-EL-001','','','','','','']])}
function importToppers(text){
  text=String(text||'').replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';const cnt=ch=>first.split(ch).length-1;
  const delim=cnt(',')>=cnt(';')&&cnt(',')>=cnt('\t')?',':(cnt(';')>=cnt('\t')?';':'\t');
  let rows=parseCSV(text,delim);if(rows.length&&/level/i.test(rows[0][0]||''))rows.shift();
  let add=0,upd=0;const bad=[];let seq=0;
  rows.forEach((p,i)=>{p=p.map(x=>(x||'').trim());if(!p.some(Boolean))return;const [lvl,rk,reg,nm,sch,trd,score,message,mxs]=p;
    const lv=LV.find(l=>l===String(lvl||'').toLowerCase().replace(/\s*topper$/,'').trim());const rank=parseInt(rk,10);
    const row='Row '+(i+1)+': ';
    if(!lv){bad.push(row+'Level must be National, State or Institute');return}
    if(!(rank>=1)){bad.push(row+'Rank must be 1, 2, 3 …');return}
    let rec;
    if(reg){const u=trainees().find(x=>String(x.reg).toLowerCase()===reg.toLowerCase());if(!u){bad.push(row+'Reg No "'+reg+'" not in roster');return}
      rec={level:lv,rank,key:ukey(u),name:u.name,scheme:u.scheme,trade:u.trade}}
    else{const sc=['CTS','CITS','Other'].find(s=>s.toLowerCase()===sch.toLowerCase());
      if(!nm){bad.push(row+'Name (or Reg No) required');return}
      if(!sc){bad.push(row+'Scheme must be CTS, CITS or Other');return}
      const tm=matchTrade(sc,trd);if(!tm){bad.push(row+'Trade "'+trd+'" not in admin list ('+sc+')');return}
      rec={level:lv,rank,key:'',name:nm,scheme:sc,trade:tm}}
    rec.score=score||'';rec.message=message||'';rec.photo='';if(+mxs>0)rec.max=+mxs;
    const k=S.toppers.findIndex(x=>x.level===rec.level&&x.rank===rec.rank&&x.scheme===rec.scheme&&x.trade===rec.trade);
    if(k>=0){const o=S.toppers[k];rec.id=o.id;rec.photo=o.photo||'';if(!message)rec.message=o.message||'';if(!score)rec.score=o.score||'';if(!rec.max&&o.max)rec.max=o.max;if(o.noShow&&!rec.key)rec.noShow=true;S.toppers[k]=rec;upd++}
    else{rec.id=Date.now()+(seq++);S.toppers.push(rec);add++}});
  return{add,upd,bad}}
function runTpImport(text){if(!canTopper())return;if(!String(text||'').trim()){tpImpMsg={t:'err',m:'Nothing to import: the file or paste box is empty.'};render();return}
  const r=importToppers(text);if(r.add||r.upd)persist();
  tpImpMsg={t:(r.bad.length&&!r.add&&!r.upd)?'err':'ok',m:`Added ${r.add}, updated ${r.upd}, rejected ${r.bad.length}`+(r.bad.length?' — '+r.bad.slice(0,8).join('; '):'')};render()}
function readTopperFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>runTpImport(String(r.result));r.readAsText(f)}
function tpManage(){return `<section class="card"><div><button class="ghost sm" onclick="tpMode='grid';render()">← ${T('tp_back')}</button></div><h2>⚙️ ${T('tp_manage')}</h2>${tpAuditBox()}<datalist id="mx_dl"><option value="600"><option value="750"><option value="1200"></datalist>${tpMaxBox()}<p><button onclick="exportTopperPage()">🌐 ${T('tp_export')}</button></p><div class="msg info"><b>Upload toppers (CSV)</b><br><code>Level, Rank, Reg No, Name, Scheme, Trade, Score, Message, Max Marks</code><br><span style="font-size:.85rem">Give a Reg No to pick the trainee from the roster, or leave it blank and fill Name, Scheme and Trade. Photos are added one by one below. Uploading the same Level + Rank + Trade again updates that topper.</span></div>
 ${tpImpMsg?`<div class="msg ${tpImpMsg.t}">${esc(tpImpMsg.m)}</div>`:''}
 <div class="row"><button type="button" onclick="topperTemplate()">⬇️ CSV template</button></div>
 <label>CSV file</label><input type="file" accept=".csv,.tsv,.txt" onchange="readTopperFile(this)">
 <label>…or paste rows</label><textarea id="tp_paste" rows="3" placeholder="National,1,,Sample Name,CTS,Electrician,95%,"></textarea><p><button type="button" onclick="runTpImport($('#tp_paste').value)">Import toppers</button></p><div id="tpMsg"></div>
 <form onsubmit="saveTp(event)"><input type="hidden" id="m_id">
 <div class="row"><div><label>${T('tp_level')}</label><select id="m_level">${LV.map(l=>`<option value="${l}">${T('lv_'+l)}</option>`).join('')}</select></div>
 <div><label>${T('tp_rank')}</label><select id="m_rank"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
 <div style="flex:2 1 300px"><label>${T('tp_trainee')}</label><input id="m_trainee" list="tpl" autocomplete="off"><datalist id="tpl">${trainees().map(u=>`<option value="${esc(u.name+' — '+u.reg)}">${esc(u.trade)}</option>`).join('')}</datalist></div></div>
 <label style="font-weight:500"><input type="checkbox" id="m_manual" style="width:auto" onchange="$('#m_man').style.display=this.checked?'flex':'none'"> ${T('tp_manual')}</label>
 <div class="row" id="m_man" style="display:none"><div><label>${T('name')}</label><input id="m_name"></div><div><label>${T('trade')}</label><input id="m_trade" list="tl3"><datalist id="tl3">${allTrades().map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div><div><label>${T('scheme')}</label><select id="m_scheme"><option>CTS</option><option>CITS</option><option>Other</option></select></div></div>
 <div class="row"><div><label>${T('tp_score')}</label><input id="m_score"></div><div><label>${T('mx_entry')}</label><input id="m_max" type="number" min="1" list="mx_dl" placeholder="${esc(T('mx_default'))}"></div><div style="flex:2 1 300px"><label>${T('tp_msg')}</label><input id="m_msg" list="tp_sug" autocomplete="off" placeholder="${esc(T('tp_msg_ph'))}"><datalist id="tp_sug">${[1,2,3,4].map(i=>T('tp_c'+i)).concat([1,2,3,4].map(i=>T('tp_s'+i))).map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div></div>
 <label>${T('tp_photo')}</label><div class="row" style="align-items:center"><input type="file" accept="image/*" onchange="readTpPhoto(this)" style="flex:2 1 260px"><div id="m_prev" style="flex:0 0 70px"></div><button type="button" class="ghost sm" style="flex:0 0 auto" onclick="tpPhoto='';updTpPrev()">${T('tp_rm_photo')}</button></div>
 <p><button>${T('save')}</button></p></form>
 <p style="color:var(--mute)">${T('tp_noshow_note')}</p>
 <div class="scroll"><table><tr><th></th><th>${T('tp_level')}</th><th>${T('trade')}</th><th>${T('name')}</th><th>${T('tp_score')}</th><th>${T('mx_entry')}</th><th>${T('tp_noshow')}</th><th></th></tr>
 ${tpSorted().map(t=>`<tr><td>${medalSvg(t.rank,24)}</td><td>${T('lv_'+t.level)}</td><td>${esc(t.trade)} · ${esc(t.scheme)}</td><td>${esc(t.name)}</td><td><input style="min-width:5rem" value="${esc(t.score||'')}" onchange="setTpF(${t.id},'score',this.value)"></td><td><input type="number" min="1" list="mx_dl" style="min-width:5rem" value="${t.max||''}" placeholder="${tpMax(Object.assign({},t,{max:0}))||''}" onchange="setTpF(${t.id},'max',this.value)"></td><td><input type="checkbox" style="width:auto" ${tpNoShow(t)?'checked':''} onchange="toggleTpNoShow(${t.id})"></td><td style="white-space:nowrap"><button class="ghost sm" onclick="editTp(${t.id})">${T('edit')}</button> <button class="danger sm" onclick="delTp(${t.id})">${T('del')}</button></td></tr>`).join('')||`<tr><td colspan="8">${T('nodata')}</td></tr>`}</table></div></section>`}
function updTpPrev(){const e=$('#m_prev');if(e)e.innerHTML=tpPhoto?`<img src="${tpPhoto}" style="width:60px;height:60px;border-radius:50%;object-fit:cover">`:''}
function readTpPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height),sz=420;const c=document.createElement('canvas');c.width=c.height=sz;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,sz,sz);tpPhoto=c.toDataURL('image/jpeg',.8);updTpPrev()};img.src=r.result};r.readAsDataURL(f)}
function saveTp(e){e.preventDefault();if(!canTopper())return;const msg=m=>{$('#tpMsg').innerHTML=`<div class="msg err">${esc(m)}</div>`};
  const rec={level:$('#m_level').value,rank:+$('#m_rank').value,score:$('#m_score').value.trim(),max:+$('#m_max').value>0?+$('#m_max').value:undefined,message:$('#m_msg').value.trim(),photo:tpPhoto};
  if($('#m_manual').checked){rec.name=$('#m_name').value.trim();rec.trade=$('#m_trade').value.trim();rec.scheme=$('#m_scheme').value;rec.key='';if(!rec.name||!rec.trade){msg(T('need_all'));return}}
  else{const reg=($('#m_trainee').value.split(' — ')[1]||$('#m_trainee').value).trim();const u=trainees().find(x=>String(x.reg).toLowerCase()===reg.toLowerCase());if(!u){msg(T('need_all'));return}rec.key=ukey(u);rec.name=u.name;rec.scheme=u.scheme;rec.trade=u.trade}
  const id=+$('#m_id').value;if(id){const i=S.toppers.findIndex(x=>x.id===id);if(i>=0){rec.id=id;if(!rec.key&&S.toppers[i].noShow)rec.noShow=true;S.toppers[i]=rec}}else{rec.id=Date.now();S.toppers.push(rec)}
  tpPhoto='';persist();render()}
function editTp(id){const t=S.toppers.find(x=>x.id===id);if(!t)return;$('#m_id').value=t.id;$('#m_level').value=t.level;$('#m_rank').value=String(t.rank);$('#m_score').value=t.score||'';$('#m_max').value=t.max||'';$('#m_msg').value=t.message||'';tpPhoto=t.photo||'';updTpPrev();
  if(t.key){$('#m_manual').checked=false;$('#m_man').style.display='none';$('#m_trainee').value=t.name+' — '+(t.key.slice(2))}else{$('#m_manual').checked=true;$('#m_man').style.display='flex';$('#m_name').value=t.name;$('#m_trade').value=t.trade;$('#m_scheme').value=t.scheme}window.scrollTo(0,0)}
function delTp(id){if(!canTopper())return;S.toppers=S.toppers.filter(x=>x.id!==id);persist();render()}
function toggleTpNoShow(id){const t=S.toppers.find(x=>x.id===id);if(!t)return;const u=tpUser(t);if(u)u.noShow=!u.noShow;else t.noShow=!t.noShow;persist()}
function toggleNoShow(k){const u=S.users.find(x=>ukey(x)===k);if(!u)return;u.noShow=!u.noShow;persist()}

/* ---- projection mode (ceremony) ---- */
let proj=null,soundOn=true,actx=null;
function playSound(kind){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=actx||new AC();if(actx.state==='suspended')actx.resume();const t0=actx.currentTime;
  const seqs={intro:[392,523.25],3:[523.25,659.25,783.99],2:[523.25,659.25,783.99,1046.5],1:[523.25,659.25,783.99,1046.5,1318.5,1568]};const seq=seqs[kind]||seqs[3];
  seq.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==1?'triangle':'sine';o.frequency.value=f;const s=t0+i*.12;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+(kind==1?.9:.55));o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+1)})}catch(e){}}
const tpMaxKey=t=>String(t.scheme||'').trim().toUpperCase()+'|'+normTr(t.trade);
const tpMax=t=>{if(+t.max>0)return +t.max;const m=(S.settings.tpMax||{})[tpMaxKey(t)];if(+m>0)return +m;return String(t.scheme||'').trim().toUpperCase()==='CITS'?750:0};
const tpSc=t=>{const s=String(t.score||'').trim();if(!s)return '';if(!/^\d+(\.\d+)?$/.test(s))return s;const m=tpMax(t);return m?s+' / '+m+' ('+(s/m*100).toFixed(1)+'%)':s};
function setTpF(id,f,v){const t=S.toppers.find(x=>x.id===id);if(!t||!canTopper())return;v=String(v).trim();if(f==='max'){if(+v>0)t.max=+v;else delete t.max}else t.score=v;persist();render()}
function setTpMax(k,v){S.settings.tpMax=S.settings.tpMax||{};if(+v>0)S.settings.tpMax[k]=+v;else delete S.settings.tpMax[k];persist();render()}
function tpMaxBox(){const seen=new Map();S.toppers.forEach(t=>{const k=tpMaxKey(t);if(!seen.has(k))seen.set(k,t)});if(!seen.size)return '';
  return `<div class="msg info"><b>${T('mx_h')}</b><br><span style="font-size:.85rem">${T('mx_note')} ${T('mx_default')}</span>
  ${[...seen.entries()].map(([k,t])=>`<div class="row" style="align-items:center;margin-top:.3rem"><div style="flex:2 1 220px">${esc(tpTrName(t))} (${esc(t.scheme)})</div><div style="flex:1 1 120px"><input type="number" min="1" list="mx_dl" value="${(S.settings.tpMax||{})[k]||''}" placeholder="${String(t.scheme).toUpperCase()==='CITS'?750:''}" onchange="setTpMax('${esc(k).replace(/'/g,"\\'")}',this.value)"></div></div>`).join('')}</div>`}
const tpGK=t=>normTr(t.trade)+'|'+String(t.scheme||'').trim().toUpperCase();
const tpTrName=t=>matchTrade(t.scheme,t.trade)||String(t.trade||'').trim();
function projGroups(level,trade,scheme){const map=new Map();const nt=normTr(trade);const scOk=t=>!scheme||(scheme==='OTHER'?!['CTS','CITS'].includes(tpScU(t)):tpScU(t)===scheme);
  const base=S.toppers.filter(t=>(!level||t.level===level)&&(!trade||normTr(t.trade)===nt)&&scOk(t)&&t.rank>=1&&t.rank<=3&&!tpNoShow(t));
  const kept=level?base:tpMerge(base);const gk=t=>t.level+'|'+tpGK(t);
  const mk=t=>{const k=gk(t);if(!map.has(k))map.set(k,{level:t.level,scheme:String(t.scheme||'').trim(),trade:tpTrName(t),items:[],skipped:[]});return map.get(k)};
  kept.forEach(t=>mk(t).items.push(t));
  base.filter(t=>!kept.some(k=>k.id===t.id&&k.level===t.level)).forEach(t=>{const g=map.get(gk(t));if(g)g.skipped.push({rank:t.rank,name:t.name,also:(kept.find(x=>tpPK(x)===tpPK(t))||{}).level})});
  return [...map.values()].filter(g=>g.items.length).sort((a,b)=>LV.indexOf(a.level)-LV.indexOf(b.level)||tpScRank(a.scheme.toUpperCase())-tpScRank(b.scheme.toUpperCase())||a.trade.localeCompare(b.trade)).map(g=>{g.items.sort((a,b)=>b.rank-a.rank);return g})}
function tpAudit(){const out=[];const all=S.toppers.filter(t=>t.rank>=1&&t.rank<=3);
  const spell=new Map();S.toppers.forEach(t=>{const k=tpGK(t);if(!spell.has(k))spell.set(k,new Set());spell.get(k).add(String(t.trade||''))});
  spell.forEach((v,k)=>{if(v.size>1)out.push('⚠ '+T('au_spell')+': '+[...v].map(x=>'"'+x+'"').join(' / ')+' ('+T('au_same')+')')});
  S.toppers.forEach(t=>{const sc=String(t.score||'').trim();if(/^\d+(\.\d+)?$/.test(sc)){const m=tpMax(t);if(!m)out.push('ℹ '+t.name+': '+T('au_nomax')+' — '+tpTrName(t)+' ('+t.scheme+')');else if(+sc>m)out.push('⚠ '+t.name+': '+sc+' > '+m+' — '+T('au_over'))}if(t.rank>3)out.push('ℹ '+t.name+': '+T('au_rank4'));if(!matchTrade(t.scheme,t.trade))out.push('⚠ '+t.name+': '+T('au_unlisted')+' — '+t.trade+' ('+t.scheme+')')});
  const lv=new Map();all.forEach(t=>{const k=t.level+'|'+tpGK(t);if(!lv.has(k))lv.set(k,{level:t.level,trade:tpTrName(t),scheme:t.scheme,rk:{}});const g=lv.get(k);(g.rk[t.rank]=g.rk[t.rank]||[]).push(t)});
  const pg=projGroups('','');
  lv.forEach(g=>{const miss=[],tie=[];[1,2,3].forEach(r=>{const a=g.rk[r]||[];if(!a.length)miss.push(r);if(a.length>1)tie.push(r+' ('+a.map(x=>x.name).join(' & ')+')');a.forEach(t=>{if(tpNoShow(t))miss.push(r+' '+T('au_hidden',{n:t.name}))})});
    const pgx=pg.find(x=>x.level===g.level&&tpGK({trade:x.trade,scheme:x.scheme})===tpGK(g));const sk=pgx?pgx.skipped:[];
    const lab=T('lv_'+g.level)+' · '+g.trade+' ('+g.scheme+')';
    if(miss.length)out.push('⚠ '+lab+': '+T('au_missing')+' '+miss.join(', '));
    if(tie.length)out.push('ℹ '+lab+': '+T('au_tie')+' '+tie.join(', '));
    sk.forEach(s=>out.push('ℹ '+lab+': #'+s.rank+' '+s.name+' — '+T('au_merged',{l:T('lv_'+s.also)})))});
  return out}
function tpAuditBox(){const a=tpAudit();return a.length?`<div class="msg info" style="font-size:.85rem"><b>${T('au_h')}</b><br>${a.map(esc).join('<br>')}</div>`:`<div class="msg ok" style="font-size:.85rem">✔ ${T('au_ok')}</div>`}
function projDialog(){modal(`<h3>📽️ ${T('tp_project')}</h3><label>${T('tp_level')}</label><select id="pj_level"><option value="">${T('lv_all')}</option>${tpLevels().map(l=>`<option value="${l}" ${l===tpLevel?'selected':''}>${T('lv_'+l)}</option>`).join('')}</select>
  <label>${T('sc_lbl')}</label><select id="pj_scheme" onchange="tpSchemeChg('pj')">${tpSchemeOpts()}</select><label>${T('trade')}</label><select id="pj_trade"><option value="">${T('tp_trade_all')}</option>${tpTradesList().map(t=>`<option ${t===tpTrade?'selected':''}>${esc(t)}</option>`).join('')}</select>
  <label style="font-weight:500"><input type="checkbox" id="pj_snd" style="width:auto" checked> 🔊 ${T('tp_sound')}</label><p style="color:var(--mute)">${T('tp_noshow_note')}</p>${tpAuditBox()}<div id="pj_err"></div>
  <div class="row"><button onclick="startProj()">${T('tp_start')}</button><button class="ghost" onclick="closeModal()">${T('close')}</button></div>`)}
function startProj(){const g=projGroups($('#pj_level').value,$('#pj_trade').value,$('#pj_scheme').value);soundOn=$('#pj_snd').checked;
  if(!g.length){$('#pj_err').innerHTML=`<div class="msg err">${T('tp_none')}</div>`;return}
  closeModal();proj={groups:g,gi:0,step:0,done:false};try{const e=document.documentElement;if(e.requestFullscreen)e.requestFullscreen().catch(()=>{})}catch(_){}
  let ov=document.getElementById('proj');if(!ov){ov=document.createElement('div');ov.id='proj';document.body.appendChild(ov)}
  document.addEventListener('keydown',projKey);playSound('intro');renderProj()}
function projKey(e){if(!proj)return;if(['ArrowRight',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();projNext()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();projPrev()}else if(e.key==='Escape')projExit()}
function projNext(){if(!proj)return;if(proj.done){projExit();return}const g=proj.groups[proj.gi];
  if(proj.step<g.items.length){proj.step++;playSound(g.items[proj.step-1].rank)}else if(proj.gi<proj.groups.length-1){proj.gi++;proj.step=0;playSound('intro')}else{proj.done=true;playSound(1)}renderProj()}
function projPrev(){if(!proj)return;if(proj.done){proj.done=false;renderProj();return}if(proj.step>0)proj.step--;else if(proj.gi>0){proj.gi--;proj.step=proj.groups[proj.gi].items.length}renderProj()}
function projExit(){proj=null;document.removeEventListener('keydown',projKey);const ov=document.getElementById('proj');if(ov)ov.remove();try{if(document.fullscreenElement)document.exitFullscreen()}catch(_){}}
function projSound(){soundOn=!soundOn;renderProj()}
function renderProj(){const ov=document.getElementById('proj');if(!ov||!proj)return;
  const sparks=Array.from({length:36},(_,i)=>`<i class="spark" style="left:${(i*97)%100}%;top:${(i*53)%100}%;animation-delay:${(i%9)*.45}s;width:${4+i%5}px;height:${4+i%5}px"></i>`).join('');
  let main='',foot='',title='';
  if(proj.done){main=`<div class="pfinal pop">🏆<br>${T('tp_final')}</div>`}
  else{const g=proj.groups[proj.gi];const rev=g.items.slice(0,proj.step);const last=rev[rev.length-1];title=`🏆 ${T('lv_'+g.level)} — ${esc(g.trade)} <small>(${esc(g.scheme)})</small>`;
    const cell=(t,r)=>`<div class="pcol">${t?`<div class="pcard ${t===last?'pop':''}"><div class="tph huge">${tpAvatar(t)}</div><div class="pname">${esc(t.name)}</div><div class="psub">${medalSvg(r,92)}</div>${t.score?`<div class="psub2">${esc(tpSc(t))}</div>`:''}</div>`:`<div class="pcard ghostc">?</div>`}<div class="pbase pb${r}">${r}</div></div>`;
    const col=r=>{const its=g.items.filter(x=>x.rank===r);if(!its.length){const sk=(g.skipped||[]).filter(x=>x.rank===r);return sk.length?`<div class="pcol" style="opacity:.55"><div class="pcard"><div class="pname" style="font-size:1.1rem">★ ${esc(sk.map(x=>x.name).join(', '))}</div><div class="psub2">${esc(T('au_also',{l:T('lv_'+sk[0].also)}))}</div></div><div class="pbase pb${r}">${r}</div></div>`:''}
      return its.map(t=>cell(rev.includes(t)?t:null,r)).join('')};
    main=`<div class="podium">${col(2)}${col(1)}${col(3)}</div>`;foot=last?`<div class="pmsg pop" key="${last.id}">🎉 ${esc(tpMsg(last))}</div>`:''}
  ov.innerHTML=`<div class="rays"></div>${sparks}<div class="ptop"><div class="ptitle">${title}</div><div class="pctl"><button class="ghost" onclick="projSound()">${soundOn?'🔊':'🔈'}</button><button class="ghost" onclick="projExit()">✕ ${T('tp_exit')}</button></div></div>
  <div class="pmain" onclick="projNext()">${main}</div><div class="pfoot">${foot}<div class="phint"><button class="ghost" onclick="projPrev()">◀</button> ${T('tp_hint')} · ${proj.gi+1}/${proj.groups.length} <button class="ghost" onclick="projNext()">▶</button></div></div>`}


/* ============ CHROME CONTROLS ============ */
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('on',x===b));render()});
let fsStep=0;document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{const d=+b.dataset.fs;fsStep=d===0?0:Math.max(-2,Math.min(4,fsStep+d));document.documentElement.style.setProperty('--fs',(16+fsStep*2)+'px');document.querySelectorAll('[data-fs]').forEach(x=>x.classList.toggle('on',+x.dataset.fs===0&&fsStep===0))});
setInterval(applyTheme,30000);
setInterval(()=>{if(view==='pass')drawQR()},1000);
initFirebase();render();
</script>
