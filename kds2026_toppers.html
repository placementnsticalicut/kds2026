<style>
*{box-sizing:border-box}
:root{--ink:#1f2a44;--mute:#5b6784;--pri:#3b82c4;--acc:#e5a93c;--line:#d7e3f2;--card:#ffffffe6}
body{margin:0;font-family:"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Malayalam","Nirmala UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#eaf4ff,#fff6e6 55%,#e9fbf3);background-size:220% 220%;animation:bgs 60s ease-in-out infinite alternate;min-height:100vh;line-height:1.5;overflow-x:hidden}
@keyframes bgs{from{background-position:0 0}to{background-position:100% 100%}}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;left:0;width:200%;height:42vh;min-height:200px}.bg path{fill:#7cc4f0}
.w1{bottom:-2vh;opacity:.30;animation:fl 70s linear infinite}.w2{bottom:8vh;opacity:.2;animation:fl 110s linear infinite reverse}.w3{bottom:18vh;opacity:.12;animation:fl 150s linear infinite}

main{max-width:1100px;margin:0 auto;padding:1rem}
button,select,input{font:inherit}
select,input{border:1px solid var(--line);border-radius:12px;padding:.45rem .7rem;background:#fff;color:var(--ink);width:100%}

button.g{background:#fff;color:var(--ink);border:1px solid var(--line)}button.on{background:linear-gradient(135deg,#3b82c4,#7cc4f0);color:#fff;border:0}

.tph img{width:100%;height:100%;object-fit:cover}.tph.big{width:150px;height:150px;font-size:3.4rem;margin:1rem auto}

.tier{font-weight:800;letter-spacing:.04em}.tier1{color:#7c93ad}.tier2{color:#c58f17}.tier3{color:#8a8a8a}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.2rem;text-align:center}
.msg{padding:.6rem .9rem;border-radius:14px;background:#fff;border:1px dashed var(--pri)}
.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}.modal>div{background:#fff;border-radius:20px;max-width:560px;width:100%;padding:1rem;max-height:94vh;overflow:auto}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:1.5rem 1rem 3rem}

const I=DATA.i18n,LV=['national','state','institute'];let lang='en',level='',trade='',q='',sel=null,lastBlob=null;
const T=(k,v)=>{let s=(I[lang]&&I[lang][k])||I.en[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const L=o=>typeof o==='string'?o:(o[lang]||o.en||'');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const msgOf=t=>(t.message&&t.message.trim())?t.message:T('tp_default_msg',{name:t.name,level:T('lv_'+t.level),trade:t.trade});
const sorted=()=>DATA.toppers.slice().sort((a,b)=>LV.indexOf(a.level)-LV.indexOf(b.level)||a.trade.localeCompare(b.trade)||a.rank-b.rank||a.name.localeCompare(b.name));
const filt=()=>{const s=q.toLowerCase();return sorted().filter(t=>(!level||t.level===level)&&(!trade||t.trade===trade)&&(!s||t.name.toLowerCase().includes(s)))};
const TC={1:'1',2:'2',3:'3'};
function medal(r,w){const c=TC[r];if(!c)return '';return `<svg class="tmedal" viewBox="0 0 64 86" width="${w}" aria-hidden="true"><path d="M16 0h13l9 28H25z" fill="#c0392b"/><path d="M48 0H35l-9 28h13z" fill="#2c5fb3"/><circle cx="32" cy="55" r="27" fill="url(#mg${c})" stroke="#ffffff99" stroke-width="2"/><circle cx="32" cy="55" r="20" fill="none" stroke="#00000040" stroke-width="2"/><text x="32" y="65" text-anchor="middle" font-size="30" font-weight="900" fill="#00000080" font-family="Georgia,serif">${r}</text></svg>`}
const av=t=>t.photo?`<img src="${t.photo}" alt="">`:esc((t.name||'?').trim().charAt(0).toUpperCase());
function cardHtml(t){return `<div class="tcard" onclick="openT(${t.id})">${medal(t.rank,68)}<div class="tph">${av(t)}</div><div><b>${esc(t.name)}</b></div><div style="color:var(--mute);font-size:.85rem">${esc(t.trade)} · ${esc(t.scheme)}</div><div style="margin:.4rem 0"><span class="lvl lv-${t.level}">🏆 ${esc(T('lv_'+t.level))}</span></div>${t.rank>3?`<div class="tier">#${t.rank}</div>`:''}${t.score?`<div style="font-size:.8rem;color:var(--mute)">${esc(t.score)}</div>`:''}</div>`}
function gridHtml(){const l=filt();return l.length?`<div class="tgrid">${l.map(cardHtml).join('')}</div>`:`<p class="msg">${esc(T('tp_none'))}</p>`}
function updGrid(){const e=$('#grid');if(e)e.innerHTML=gridHtml()}
function openT(id){location.hash='topper-'+id}
function back(){sel=null;if(location.hash)history.replaceState(null,'',location.pathname+location.search);render()}
function render(){
  document.documentElement.lang=lang;$('#ttl').textContent=L(DATA.title);$('#sub').textContent=T('tp_h')+' · '+DATA.venue;$('#foot').textContent=L(DATA.title)+' · '+DATA.venue;
  document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  const t=sel!=null?DATA.toppers.find(x=>x.id===sel):null;
  if(t){const l=filt();const i=l.findIndex(x=>x.id===t.id);const pv=i>0?l[i-1].id:null,nx=i>=0&&i<l.length-1?l[i+1].id:null;
    $('#app').innerHTML=`<div class="card"><div style="text-align:left"><button class="b g" onclick="back()">← ${esc(T('tp_back'))}</button></div>
    <div style="font-size:3.2rem;line-height:1">🏆</div><span class="lvl lv-${t.level}" style="font-size:.95rem;padding:.2rem 1rem">${esc(T('lv_'+t.level))}</span>
    <div class="tph big">${av(t)}</div>${t.rank<=3?`<div style="margin:-1.9rem auto .2rem;width:100px">${medal(t.rank,100)}</div>`:`<div class="tier">#${t.rank}</div>`}
    <h2 style="margin:.4rem 0 0;font-size:1.7rem">${esc(t.name)}</h2><div style="color:var(--mute)">${esc(t.trade)} · ${esc(t.scheme)}${t.score?' · '+esc(t.score):''}</div>
    <p style="font-size:1.15rem;max-width:640px;margin:1rem auto">🎉 ${esc(msgOf(t))}</p>
    <div class="row" style="justify-content:center"><button class="b" style="flex:0 0 auto" onclick="shareCard(${t.id})">🖼️ ${esc(T('sh_card'))}</button><button class="b g" style="flex:0 0 auto" onclick="copyLink(${t.id})">🔗 ${esc(T('sh_link'))}</button></div>
    <div class="row" style="justify-content:center">${pv?`<button class="b g" style="flex:0 0 auto" onclick="openT(${pv})">◀</button>`:''}${nx?`<button class="b g" style="flex:0 0 auto" onclick="openT(${nx})">▶</button>`:''}</div></div>`;return}
  const trades=[...new Set(DATA.toppers.map(x=>x.trade))].sort();
  $('#app').innerHTML=`<div class="chips">${[['',T('lv_all')],...LV.map(l=>[l,T('lv_'+l)])].map(([v,l])=>`<button class="${level===v?'on':'g'}" onclick="level='${v}';render()">${esc(l)}</button>`).join('')}</div>
  <div class="row"><select onchange="trade=this.value;render()"><option value="">${esc(T('tp_trade_all'))}</option>${trades.map(x=>`<option ${x===trade?'selected':''}>${esc(x)}</option>`).join('')}</select><input placeholder="${esc(T('tp_search'))}" value="${esc(q)}" oninput="q=this.value;updGrid()"></div><div id="grid">${gridHtml()}</div>`}
function route(){const m=location.hash.match(/^#topper-(\d+)$/);sel=m?+m[1]:null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
function showModal(h){$('#modal').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div>'+h+'</div></div>'}
function closeModal(){$('#modal').innerHTML=''}
function copyLink(id){const u=location.href.split('#')[0]+'#topper-'+id;let ok=false;try{navigator.clipboard.writeText(u);ok=true}catch(e){}
  showModal(`<p><b>${esc(ok?T('sh_copied'):T('sh_link'))}</b></p><input readonly value="${esc(u)}" onfocus="this.select()"><p><button class="b" onclick="closeModal()">${esc(T('sh_close'))}</button></p>`)}
/* ---- share card (1080x1350 image for WhatsApp / Instagram / Facebook) ---- */
function wrap(x,text,maxW,maxLines){const words=String(text).split(/\s+/);const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/.{0,2}$/,'…')}return lines}
function drawCard(t){return new Promise(res=>{
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const F="'Segoe UI','Noto Sans','Noto Sans Devanagari','Noto Sans Malayalam',sans-serif";
  const done=img=>{
    let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b1d46');g.addColorStop(.55,'#2a1b66');g.addColorStop(1,'#0a1634');x.fillStyle=g;x.fillRect(0,0,W,H);
    x.save();x.translate(W/2,560);for(let i=0;i<18;i++){x.rotate(Math.PI*2/18);x.fillStyle='rgba(255,255,255,.045)';x.beginPath();x.moveTo(0,0);x.lineTo(-90,-1500);x.lineTo(90,-1500);x.closePath();x.fill()}x.restore();
    for(let i=0;i<70;i++){x.fillStyle='rgba(255,224,138,'+(.2+(i%5)*.12)+')';x.beginPath();x.arc((i*389)%W,(i*617)%H,2+(i%4),0,7);x.fill()}
    x.fillStyle='rgba(229,185,74,.22)';x.beginPath();x.moveTo(0,H-170);x.bezierCurveTo(270,H-270,540,H-70,W,H-190);x.lineTo(W,H);x.lineTo(0,H);x.fill();
    x.textAlign='center';x.fillStyle='#ffe08a';x.font='600 38px '+F;x.fillText(wrap(x,L(DATA.title),960,1)[0],W/2,84);
    x.font='140px '+F;x.fillText('🏆',W/2,250);
    const lc={national:['#ff9933','#d9731a'],state:['#3b82c4','#1d4f91'],institute:['#1fa37a','#0f7a5a']}[t.level];const lt=T('lv_'+t.level);x.font='700 40px '+F;const pw=x.measureText(lt).width+90;
    let pg=x.createLinearGradient(W/2-pw/2,0,W/2+pw/2,0);pg.addColorStop(0,lc[0]);pg.addColorStop(1,lc[1]);x.fillStyle=pg;x.beginPath();x.roundRect?x.roundRect(W/2-pw/2,290,pw,70,35):x.rect(W/2-pw/2,290,pw,70);x.fill();x.fillStyle='#fff';x.fillText(lt,W/2,339);
    const cx=W/2,cy=580,r=170;x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();
    if(img){const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,cx-r,cy-r,2*r,2*r)}else{let ig=x.createLinearGradient(cx-r,cy-r,cx+r,cy+r);ig.addColorStop(0,'#3b82c4');ig.addColorStop(1,'#e5a93c');x.fillStyle=ig;x.fillRect(cx-r,cy-r,2*r,2*r);x.fillStyle='#fff';x.font='700 190px '+F;x.fillText((t.name||'?').trim().charAt(0).toUpperCase(),cx,cy+65)}
    x.restore();x.lineWidth=12;x.strokeStyle='#e5b94a';x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();
    let y=830;
    if(t.rank<=3){const cols={1:['#fff3b0','#b47a0a'],2:['#fbfbfb','#868b92'],3:['#f3c79a','#8a4d17']}[t.rank];const mx=cx+140,my=cy+140,R=90;
      x.fillStyle='#c0392b';x.beginPath();x.moveTo(mx-44,my-150);x.lineTo(mx-6,my-150);x.lineTo(mx+22,my-55);x.lineTo(mx-18,my-55);x.fill();x.fillStyle='#2c5fb3';x.beginPath();x.moveTo(mx+44,my-150);x.lineTo(mx+6,my-150);x.lineTo(mx-22,my-55);x.lineTo(mx+18,my-55);x.fill();
      let mg=x.createLinearGradient(mx-R,my-R,mx+R,my+R);mg.addColorStop(0,cols[0]);mg.addColorStop(1,cols[1]);x.fillStyle=mg;x.beginPath();x.arc(mx,my,R,0,7);x.fill();x.lineWidth=6;x.strokeStyle='rgba(255,255,255,.7)';x.stroke();x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.25)';x.beginPath();x.arc(mx,my,R-14,0,7);x.stroke();
      x.fillStyle='rgba(0,0,0,.55)';x.font='900 100px Georgia,serif';x.fillText(String(t.rank),mx,my+34)}
    x.fillStyle='#fff';x.font='800 78px '+F;const nl=wrap(x,t.name,940,2);nl.forEach((s,i)=>x.fillText(s,W/2,y+70+i*90));y+=70+(nl.length-1)*90+60;
    x.fillStyle='rgba(255,255,255,.85)';x.font='500 44px '+F;x.fillText(wrap(x,t.trade+' · '+t.scheme+(t.score?' · '+t.score:''),960,1)[0],W/2,y);y+=70;
    x.fillStyle='#ffe9a6';x.font='500 38px '+F;wrap(x,'🎉 '+msgOf(t),900,3).forEach((s,i)=>x.fillText(s,W/2,y+i*52));
    x.fillStyle='rgba(255,255,255,.8)';x.font='500 30px '+F;x.fillText(wrap(x,DATA.venue,960,1)[0],W/2,H-48);
    res(c)};
  if(t.photo){const im=new Image();im.onload=()=>done(im);im.onerror=()=>done(null);im.src=t.photo}else done(null)})}
async function shareCard(id){const t=DATA.toppers.find(x=>x.id===id);if(!t)return;const c=await drawCard(t);let url='';try{url=c.toDataURL('image/png')}catch(e){}
  showModal(`<img src="${url}" alt="" style="width:100%;border-radius:12px"><p style="color:var(--mute);font-size:.85rem">${esc(T('sh_hint'))}</p><div class="row"><button class="b" onclick="dlCard()">⬇ ${esc(T('sh_dl'))}</button><button class="b g" onclick="nativeShare()">📤 ${esc(T('sh_share'))}</button><button class="b g" onclick="closeModal()">${esc(T('sh_close'))}</button></div>`);
  c.toBlob(b=>{lastBlob={b,name:(t.name||'topper').replace(/\W+/g,'_')+'.png',text:L(DATA.title)+' — '+msgOf(t)}},'image/png')}
function dlCard(){if(!lastBlob)return;try{const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob.b);a.download=lastBlob.name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
async function nativeShare(){if(!lastBlob)return;try{const f=new File([lastBlob.b],lastBlob.name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:L(DATA.title),text:lastBlob.text});else await navigator.share({title:L(DATA.title),text:lastBlob.text,url:location.href})}catch(e){}}
route();
</script>
